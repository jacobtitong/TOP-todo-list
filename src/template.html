<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <body>
    <div class="top"></div>
    <nav class="side-bar"></nav>
    <main class="content"></main>
    <dialog>
      <form class="add-task-container no-widget">
        <div class="contents">
          <label for="task-name"
            ><input type="text" placeholder="Task name" id="task-name"
          /></label>
          <label for="description"
            ><input type="text" placeholder="Description" id="description"
          /></label>
        </div>
        <div>
          <div class="additional-contents">
            <div>
              <label for="due-date"
                ><input type="datetime-local" id="due-date"
              /></label>
              <div class="date-time-picker" tabindex="0">
                <div class="value">No Date</div>

                <div class="date-time hidden">
                  <div class="dates">
                    <div class="month">
                      <div class="arrows prev-month">&lt;</div>
                      <div class="mth">October 2026</div>
                      <div class="arrows next-month">&gt;</div>
                    </div>
                    <div class="days">
                      <div class="day">M</div>
                      <div class="day">T</div>
                      <div class="day">W</div>
                      <div class="day">T</div>
                      <div class="day">F</div>
                      <div class="day">S</div>
                      <div class="day">S</div>
                      <div class="non-month-day">30</div>
                      <div class="non-month-day">31</div>
                      <div>1</div>
                      <div>2</div>
                      <div>3</div>
                      <div>4</div>
                      <div>5</div>
                      <div class="selected">6</div>
                      <div>7</div>
                      <div>8</div>
                      <div>9</div>
                      <div>10</div>
                      <div>11</div>
                      <div>12</div>
                      <div>13</div>
                      <div>14</div>
                      <div>15</div>
                      <div>16</div>
                      <div>17</div>
                      <div>18</div>
                      <div>19</div>
                      <div>20</div>
                      <div>21</div>
                      <div>22</div>
                      <div>23</div>
                      <div>24</div>
                      <div>25</div>
                      <div>26</div>
                      <div>27</div>
                      <div>28</div>
                      <div>29</div>
                      <div>30</div>
                      <div class="non-month-day">1</div>
                      <div class="non-month-day">2</div>
                      <div class="non-month-day">3</div>
                    </div>
                  </div>
                  <div class="time">
                    <div class="hours">
                      <div class="arrows prev-hour">&lt;</div>
                      <div class="hour">9</div>
                      <div class="arrows next-hour">&gt;</div>
                    </div>
                    <div class="colon">&#58</div>
                    <div class="minutes">
                      <div class="arrows prev-minute">&lt;</div>
                      <div class="minute">54</div>
                      <div class="arrows next-minute">&gt;</div>
                    </div>
                    <div class="state">
                      <div class="selected">AM</div>
                      <div>PM</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div>
              <select name="priority" tabindex="0">
                <option value="1">Priority 1</option>
                <option value="2">Priority 2</option>
                <option value="3">Priority 3</option>
                <option value="4" selected>Priority 4</option>
              </select>

              <div class="select priority-select" role="listbox">
                <span class="value">Priority 4</span>
                <ul class="optList hidden" role="presentation">
                  <li class="option priority-1" role="option">Priority 1</li>
                  <li class="option priority-2" role="option">Priority 2</li>
                  <li class="option priority-3" role="option">Priority 3</li>
                  <li
                    class="option priority-4"
                    role="option"
                    aria-selected="true"
                  >
                    Priority 4
                  </li>
                </ul>
              </div>
            </div>
            <select name="projects">
              <option value="inbox">inbox</option>
            </select>
          </div>
          <div class="actions">
            <button>Cancel</button>
            <button>Add Task</button>
          </div>
        </div>
      </form>
    </dialog>
  </body>
</html>
