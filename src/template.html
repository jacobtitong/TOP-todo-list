<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <body>
    <div class="top"></div>
    <nav class="side-bar"></nav>
    <main class="content"></main>
    <dialog>
      <form class="add-task-container no-widget">
        <div class="contents">
          <label for="task-name"
            ><input type="text" placeholder="Task name" id="task-name"
          /></label>
          <label for="description"
            ><input type="text" placeholder="Description" id="description"
          /></label>
        </div>
        <div>
          <div class="additional-contents">
            <label for="due-date"
              ><input type="datetime-local" id="due-date"
            /></label>
            <div>
              <select name="priority">
                <option value="1">Priority 1</option>
                <option value="2">Priority 2</option>
                <option value="3">Priority 3</option>
                <option value="4" selected>Priority 4</option>
              </select>

              <div class="select priority-select" role="listbox">
                <span class="value">Priority 4</span>
                <ul class="optList hidden" role="presentation">
                  <li class="option priority-1" role="option">Priority 1</li>
                  <li class="option priority-2" role="option">Priority 2</li>
                  <li class="option priority-3" role="option">Priority 3</li>
                  <li
                    class="option priority-4"
                    role="option"
                    aria-selected="true"
                  >
                    Priority 4
                  </li>
                </ul>
              </div>
            </div>
            <select name="projects">
              <option value="inbox">inbox</option>
            </select>
          </div>
          <div class="actions">
            <button>Cancel</button>
            <button>Add Task</button>
          </div>
        </div>
      </form>
    </dialog>
  </body>
</html>
